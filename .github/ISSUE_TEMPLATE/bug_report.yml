name: 问题反馈 / Bug report
description: 界面、安装、扫描、分流或恢复问题 / UI, installation, routing or recovery
body:
  - type: markdown
    attributes:
      value: |
        请先阅读使用指南。不要上传订阅、代理密码、控制接口密钥、完整扫描结果或个人路径。
        Read the guide first. Do not upload subscriptions, credentials, full inventories or personal paths.
  - type: dropdown
    id: platform
    attributes:
      label: 系统与架构 / Platform
      options:
        - Windows x64
        - macOS Apple silicon (experimental)
        - macOS Intel (experimental)
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与安装来源 / Versions and download source
      description: 从“关于”复制 AppRoute 版本；补充系统、Clash Party、Mihomo 版本和安装包名称。勿包含密钥。
      placeholder: AppRoute version, OS version, Clash Party / Mihomo version, package filename, download URL
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 包括是否首次安装、升级或唤醒后出现，以及联网方式和代理策略；应用/节点可用虚构名称代替。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
      description: 区分规则就绪与新连接已验证；附准确错误、诊断时间或安全软件检测名称。提交前检查敏感信息。
    validations:
      required: true
